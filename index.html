<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор квизов</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/pages/index.css" />
</head>

<body class="page">
  <header class="header">
    <div class="layout header__container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 40" class="logo">
        <use href="./assets/logo.svg" />
      </svg>
      <button class="button__logo" type="button">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 12H36" stroke="#1E40FF" stroke-width="2" class="up__line" />
          <path d="M8 22H36" stroke="#1E40FF" stroke-width="2" class="medium__line" />
          <path d="M8 32H36" stroke="#1E40FF" stroke-width="2" class="down__line" />
        </svg>
      </button>
      <nav class="buttons-container">
        <button class="header__button button__to_all_quizzes text__body_accent navigate__to_quizzes" type="button">
          Посмотреть сохранённые квизы
        </button>
      </nav>
    </div>
    <nav class="mobile__nav">
      <button class="header__button text__body_accent navigate__to_quizzes">
        Сохранённые квизы
      </button>
    </nav>
  </header>
  <main class="main layout">
    <section class="layout__container small__layout_container generator">
      <div class="generator__section-titles">
        <h1 class="adaptive__title ">Генератор квизов</h1>
        <span class="text__body">Вставьте JSON…</span>
      </div>
      <form class="form__generator" name="formContainer">
        <label for="textarea" class="text__caption">Ваш JSON</label>
        <textarea id="textarea" name="json" placeholder='{
  "title": "Placeholder",
  "questions": []
}' class="textarea text__mono"></textarea>
        <button type="submit" name="generate"
          class="button form__button button__primary text__body_accent">Сгенерировать</button>
      </form>
      <div class="block__error">
        <div class="block__error_header">
          <div class="error__logo">❌</div>
          <span>Ошибка: не удалось обработать JSON.</span>
          <span class="text__caption">Проверьте формат данных и попробуйте снова.</span>
        </div>
        <button class="button button__secondary" name="retry" type="button">Попробовать снова</button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/pages/main.js"></script>
  <footer class="footer">
    <div class="footer__title">Учебный проект 2026</div>
  </footer>
</body>

</html>
